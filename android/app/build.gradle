plugins {
    id 'com.android.application'
}

// -Pspindle.ndkVersion=..., -Pspindle.cmakeVersion=..., -Pspindle.abis=arm64-v8a,x86_64 override these.
def spindleProp = { String name, String fallback -> (project.findProperty(name) ?: fallback).toString() }

// Release signing comes from the environment so the keystore never enters the repository:
// SPINDLE_KEYSTORE (path), SPINDLE_KEYSTORE_PASSWORD, SPINDLE_KEY_ALIAS, SPINDLE_KEY_PASSWORD.
def keystorePath = System.getenv("SPINDLE_KEYSTORE")
def haveReleaseKey = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace 'io.itch.chayce22315.spindle'
    compileSdk 35
    ndkVersion spindleProp('spindle.ndkVersion', '28.2.13676358')

    defaultConfig {
        applicationId 'io.itch.chayce22315.spindle'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DSPINDLE_BUILD_TESTS=OFF'
                abiFilters(*spindleProp('spindle.abis', 'arm64-v8a,x86_64').split(','))
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version spindleProp('spindle.cmakeVersion', '3.31.6')
        }
    }

    signingConfigs {
        if (haveReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("SPINDLE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SPINDLE_KEY_ALIAS")
                keyPassword System.getenv("SPINDLE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Without a release key the APK is signed with the debug key: installable for testing and
            // side-loading, but not for the Play Store.
            signingConfig haveReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}
