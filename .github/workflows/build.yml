name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset msvc-x64-release

      - name: Build
        run: cmake --build --preset msvc-x64-release --parallel

      - name: Unit tests
        run: build\msvc-x64\Release\spindle_tests.exe

      - name: Data checks
        run: |
          python tools/gen_sfx.py --check
          python tools/gen_art.py --check
          python tools/validate_settings.py --exe build\msvc-x64\Release\spindle.exe
          python tools/level_report.py --exe build\msvc-x64\Release\spindle.exe --rounds 200 --seeds 5

      - name: Four-station self-test (headless)
        run: python tools/run_selftest.py build\msvc-x64\Release\spindle.exe --out selftest-run

      - name: Boot log from the self-test
        if: always()
        shell: pwsh
        run: |
          if (Test-Path selftest-run\logs\spindle.log) {
            Get-Content selftest-run\logs\spindle.log | Select-String -Pattern 'boot |deps:|assets:|display:|audio:|warn|error' | Select-Object -First 60
          }

      - name: Package
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\msvc-x64\Release\spindle.exe dist\
          Copy-Item README.md, LICENSE dist\
          Copy-Item -Recurse docs dist\docs
          Compress-Archive -Path dist\* -DestinationPath spindle-windows-x64.zip -Force

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spindle-windows-x64
          path: spindle-windows-x64.zip

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-windows
          path: selftest-run
          if-no-files-found: ignore

  linux-core:
    name: Linux core + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core only)
        run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Debug -DSPINDLE_BUILD_GAME=OFF
      - name: Build
        run: cmake --build build/core --parallel
      - name: Unit tests
        run: build/core/spindle_tests
      - name: Sound and image recipes match the committed files
        run: |
          python3 tools/gen_sfx.py --check
          python3 tools/gen_art.py --check

  linux-game:
    name: Linux x64 (game + self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Development packages SDL builds its Linux backends against
        # SDL loads X11, Wayland, ALSA and PulseAudio at run time; the headers only switch them on.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev
      - name: Configure
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/linux --parallel
      - name: Unit tests
        run: build/linux/spindle_tests
      - name: Four-station self-test (headless)
        run: python3 tools/run_selftest.py build/linux/spindle --out selftest-run
      - name: Package
        run: |
          mkdir -p dist/spindle
          cp build/linux/spindle README.md LICENSE dist/spindle/
          cp -r docs dist/spindle/docs
          tar -C dist -czf spindle-linux-x64.tar.gz spindle
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-linux-x64
          path: spindle-linux-x64.tar.gz
      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-linux
          path: selftest-run
          if-no-files-found: ignore

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Pick the NDK and CMake (stable releases the runner already has)
        run: |
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          # Prefer the NDK the project names, then the newest r28/r27; CMake: the newest 3.x (>= 3.25).
          NDK=$(ls "$ANDROID_HOME/ndk" | grep -x '28.2.13676358' || ls "$ANDROID_HOME/ndk" | grep -E '^2[78]\.' | sort -V | tail -1)
          [ -n "$NDK" ] || NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          CMAKE=$(ls "$ANDROID_HOME/cmake" | grep -E '^3\.(2[5-9]|3[0-9])\.' | sort -V | tail -1)
          [ -n "$CMAKE" ] || CMAKE=$(ls "$ANDROID_HOME/cmake" | sort -V | tail -1)
          echo "NDK $NDK, CMake $CMAKE"
          echo "SPINDLE_NDK=$NDK" >> "$GITHUB_ENV"
          echo "SPINDLE_CMAKE=$CMAKE" >> "$GITHUB_ENV"
      - name: Release signing key (optional repository secrets)
        # Set SPINDLE_KEYSTORE_B64 (base64 of the keystore file), SPINDLE_KEYSTORE_PASSWORD,
        # SPINDLE_KEY_ALIAS and SPINDLE_KEY_PASSWORD to sign the release APK with your own key.
        env:
          KEYSTORE_B64: ${{ secrets.SPINDLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spindle-release.keystore"
            echo "SPINDLE_KEYSTORE=$RUNNER_TEMP/spindle-release.keystore" >> "$GITHUB_ENV"
            echo "release APK: signed with the repository's release key"
          else
            echo "release APK: no SPINDLE_KEYSTORE_B64 secret, signed with the debug key"
          fi
      - name: Build the release APK (arm64 + x86_64)
        working-directory: android
        env:
          SPINDLE_KEYSTORE_PASSWORD: ${{ secrets.SPINDLE_KEYSTORE_PASSWORD }}
          SPINDLE_KEY_ALIAS: ${{ secrets.SPINDLE_KEY_ALIAS }}
          SPINDLE_KEY_PASSWORD: ${{ secrets.SPINDLE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -Pspindle.ndkVersion="$SPINDLE_NDK" -Pspindle.cmakeVersion="$SPINDLE_CMAKE"
      - name: Build the debug APK for the emulator (x86_64)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pspindle.ndkVersion="$SPINDLE_NDK" -Pspindle.cmakeVersion="$SPINDLE_CMAKE" -Pspindle.abis=x86_64
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/spindle-android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/spindle-android-debug-x86_64.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-android
          path: dist/spindle-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-android-debug-x86_64
          path: dist/spindle-android-debug-x86_64.apk

  android-selftest:
    name: Android self-test (emulator)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spindle-android-debug-x86_64
          path: dist
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the four-station self-test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/android_selftest.sh dist/spindle-android-debug-x86_64.apk selftest-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-android
          path: selftest-android
          if-no-files-found: ignore

  ios:
    name: iOS (device .ipa, simulator build + self-test)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Xcode, iOS simulator)
        run: >
          cmake -S . -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.4
      - name: Build
        run: |
          # xcodebuild is very chatty: keep the full log as an artifact and show only the problems here.
          if ! cmake --build build/ios --config Release -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO > ios-build.log 2>&1; then
            grep -E -A8 "(error|fatal error):|libtool:|ld: " ios-build.log | head -n 300
            grep -E -A25 "^Libtool .*libspindle_core" ios-build.log | grep -v -E "^ +(cd|export|/Applications.*clang)" | head -n 60
            grep -E -A20 "The following build commands failed" ios-build.log | head -n 40
            exit 1
          fi
          grep -c "warning:" ios-build.log || true
          tail -n 3 ios-build.log
      - name: Build for iPhone and iPad (arm64, unsigned)
        run: |
          if ! cmake --build build/ios --config Release -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > ios-device-build.log 2>&1; then
            grep -E -A8 "(error|fatal error):|ld: " ios-device-build.log | head -n 200
            grep -E -A20 "The following build commands failed" ios-device-build.log | head -n 40
            exit 1
          fi
          tail -n 3 ios-device-build.log
      - name: Package the unsigned .ipa
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/Release-iphoneos/spindle.app ipa/Payload/
          (cd ipa && zip -qry ../spindle-ios-unsigned.ipa Payload)
          ls -la spindle-ios-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :MinimumOSVersion" ipa/Payload/spindle.app/Info.plist
          lipo -info ipa/Payload/spindle.app/spindle
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-ios-unsigned-ipa
          path: spindle-ios-unsigned.ipa
      - name: Run the four-station self-test in the iOS simulator
        timeout-minutes: 45
        run: python3 ci/ios_selftest.py build/ios/Release-iphonesimulator/spindle.app selftest-ios
      - name: Package the simulator app
        if: always()
        run: |
          if [ -d build/ios/Release-iphonesimulator/spindle.app ]; then
            (cd build/ios/Release-iphonesimulator && zip -qry ../../../spindle-ios-simulator.zip spindle.app)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spindle-ios-simulator
          path: spindle-ios-simulator.zip
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: |
            ios-build.log
            ios-device-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-ios
          path: selftest-ios
          if-no-files-found: ignore
