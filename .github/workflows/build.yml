name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset msvc-x64-release

      - name: Build
        run: cmake --build --preset msvc-x64-release --parallel

      - name: Unit tests
        run: build\msvc-x64\Release\spindle_tests.exe

      - name: Data checks
        run: |
          python tools/gen_sfx.py --check
          python tools/validate_settings.py --exe build\msvc-x64\Release\spindle.exe
          python tools/level_report.py --exe build\msvc-x64\Release\spindle.exe --rounds 200 --seeds 5

      - name: Four-station self-test (headless)
        run: python tools/run_selftest.py build\msvc-x64\Release\spindle.exe --out selftest-run

      - name: Package
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\msvc-x64\Release\spindle.exe dist\
          Copy-Item README.md, LICENSE dist\
          Copy-Item -Recurse docs dist\docs
          Compress-Archive -Path dist\* -DestinationPath spindle-windows-x64.zip -Force

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spindle-windows-x64
          path: spindle-windows-x64.zip

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-windows
          path: selftest-run
          if-no-files-found: ignore

  linux-core:
    name: Linux core + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core only)
        run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Debug -DSPINDLE_BUILD_GAME=OFF
      - name: Build
        run: cmake --build build/core --parallel
      - name: Unit tests
        run: build/core/spindle_tests
      - name: Sound recipes match the committed files
        run: python3 tools/gen_sfx.py --check
